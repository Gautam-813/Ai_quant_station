
services:
  # Backend: FastAPI Web Service
  - type: web
    name: impulse-analyst-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: impulse-db
          property: connectionString
      - key: MT5_API_TOKEN
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
      # Add your AI Keys in Render Dashboard Environment Variables
      - key: NVIDIA_API_KEY
        sync: false
      - key: CEREBRAS_API_KEY
        sync: false

  # Frontend: Static Site
  - type: static
    name: impulse-analyst-frontend
    env: static
    buildCommand: npm install && npm run build
    publishDir: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: impulse-analyst-backend
          property: host

databases:
  - name: impulse-db
    plan: free # Change to starter for production
