services:
  # Single Web Service - FastAPI serves both frontend AND backend
  - type: web
    name: impulse-analyst
    env: python
    buildCommand: |
      pip install -r backend/requirements.txt
      cd frontend && npm install && npm run build
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: impulse-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: MT5_API_TOKEN
        value: "impulse_secure_2026"
      # Add these in Render Dashboard with your actual keys:
      - key: NVIDIA_API_KEY
        sync: false
      - key: CEREBRAS_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPEN_ROUTER_API_KEY
        sync: false
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: HF_REPO_ID
        value: "TheFinanceEngineer/impulse-market-data"

databases:
  - name: impulse-db
    plan: free