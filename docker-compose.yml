services:
  postgres:
    image: postgres:16-alpine
    container_name: impulse_postgres
    environment:
      POSTGRES_DB: impulse_analyst
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - impulse_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: impulse_backend
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/impulse_analyst
      - CORS_ORIGINS=http://localhost:3000,http://localhost:8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - impulse_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G

  # nginx:
  #   Disabled — nginx.conf is not present in the repo.
  #   The backend is exposed directly on port 8000.
  #   To add a reverse proxy: create nginx.conf and uncomment this block.
  #   image: nginx:alpine
  #   container_name: impulse_nginx
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #   ports:
  #     - "80:80"
  #   depends_on:
  #     - backend
  #   networks:
  #     - impulse_network
  #   restart: unless-stopped
  #   deploy:
  #     resources:
  #       limits:
  #         memory: 128M

volumes:
  postgres_data:

networks:
  impulse_network:
    driver: bridge