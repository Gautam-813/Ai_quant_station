version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: impulse_postgres
    environment:
      POSTGRES_DB: impulse_analyst
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - impulse_network

  # Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: impulse_backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/impulse_analyst
      - SECRET_KEY=impulse-secret-key-change-in-production-use-secure-random
      - MT5_API_TOKEN=impulse_secure_2026
      - HUGGINGFACE_API_KEY=
      - HF_REPO_ID=TheFinanceEngineer/impulse-market-data
      - CORS_ORIGINS=http://localhost:3000,http://frontend:3000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - impulse_network
    restart: unless-stopped

  # Frontend (Optional - can also serve from backend)
  # Uncomment if you want separate frontend container
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   ports:
  #     - "3000:3000"
  #   depends_on:
  #     - backend
  #   networks:
  #     - impulse_network

  # Nginx Reverse Proxy (Production)
  nginx:
    image: nginx:alpine
    container_name: impulse_nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    networks:
      - impulse_network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  impulse_network:
    driver: bridge